name: Build Iraqi Curriculum Library v1.3.0 - Exact HTML UI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'iraqi_curriculum_library_v1.3.0.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository with ZIP kept compressed
        uses: actions/checkout@v4

      - name: Extract exactly the v1.3.0 library archive on runner
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/iraqi_curriculum_library_v1.3.0.zip"
          if [[ ! -s "$ARCHIVE" ]]; then
            echo '::error::Missing iraqi_curriculum_library_v1.3.0.zip at repository root. Upload it without extracting.'
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          fi
          PROJECT="$RUNNER_TEMP/iraqi_library_v130"
          mkdir -p "$PROJECT"
          unzip -q "$ARCHIVE" -d "$PROJECT"
          for item in pubspec.yaml lib/main.dart lib/screens/html_library_shell.dart \
            lib/screens/pdf_reader_screen.dart assets/library_ui.html \
            assets/library_catalog.json tool/configure_android_gradle.py \
            tool/configure_android_manifest.py; do
            if [[ ! -s "$PROJECT/$item" ]]; then
              echo "::error::Missing required file: $item"
              exit 1
            fi
          done
          export PROJECT
          python3 - <<'PY'
          import json,os,pathlib,re
          p=pathlib.Path(os.environ['PROJECT'])
          catalog=json.loads((p/'assets/library_catalog.json').read_text(encoding='utf-8'))
          html=(p/'assets/library_ui.html').read_text(encoding='utf-8')
          assert len(catalog)==157, 'Catalog does not have 157 books'
          data=json.loads(re.search(r'const BOOKS=(\[.*?\]);\s*\n',html,re.S).group(1))
          assert data==catalog, 'HTML and native catalog differ'
          assert "openNativeFeature('downloads')" in html
          assert "openNativeFeature('reviews')" in html
          assert 'NativeLibrary.postMessage' in html
          print('Verified: identical catalog in HTML and Flutter, 157 entries.')
          PY
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project and configure notifications and Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter create --platforms=android --project-name=iraqi_curriculum_library --org=com.school.app .
          python3 tool/configure_android_gradle.py
          python3 tool/configure_android_manifest.py

      - name: Resolve Dart and Android dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze source and the exact HTML host
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Run library and HTML asset tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test --no-pub --reporter expanded

      - name: Build APK release
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -s "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
          ls -lh "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: iraqi-library-v1.3.0-exact-html-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 21
