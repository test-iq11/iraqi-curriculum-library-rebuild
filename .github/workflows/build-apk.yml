name: Build Iraqi Curriculum Library APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore project from ZIP (no manual extraction needed)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          PROJECT="$RUNNER_TEMP/iraqi_curriculum_library_source"
          mkdir -p "$PROJECT"
          # Prefer the versioned release archive. If only a legacy valid
          # archive exists, accept it as a fallback without requiring renaming.
          ARCHIVE=""
          if [ -f "$ROOT/iraqi_curriculum_library_v1.2.0.zip" ]; then
            ARCHIVE="$ROOT/iraqi_curriculum_library_v1.2.0.zip"
          fi
          while [ -z "$ARCHIVE" ] && IFS= read -r candidate; do
            if unzip -Z1 "$candidate" | grep -qx 'pubspec.yaml' && \
               unzip -Z1 "$candidate" | grep -qx 'lib/main.dart' && \
               unzip -Z1 "$candidate" | grep -qx 'tool/configure_android_gradle.py' && \
               unzip -Z1 "$candidate" | grep -qx 'tool/configure_android_manifest.py'; then
              ARCHIVE="$candidate"
              break
            fi
          done < <(find "$ROOT" -maxdepth 1 -type f \
            \( -name 'iraqi_curriculum_library_v*.zip' -o -name 'iraqi_curriculum_library_source.zip' -o -name '*.zip' \) \
            -printf '%T@ %p\n' | sort -nr | cut -d' ' -f2-)

          if [ -z "$ARCHIVE" ]; then
            echo '::error::Upload the complete Iraqi curriculum library ZIP into the repository root.'
            ls -lah "$ROOT"
            exit 1
          fi
          echo "Using source archive: $ARCHIVE"
          unzip -q "$ARCHIVE" -d "$PROJECT"
          test -f "$PROJECT/pubspec.yaml"
          test -f "$PROJECT/lib/main.dart"
          test -f "$PROJECT/lib/screens/pdf_reader_screen.dart"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "ZIP_SOURCE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter matching pdfrx
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          cache: true

      - name: Create Android host files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter create --platforms=android --project-name=iraqi_curriculum_library --org=com.school.app .
          python3 tool/configure_android_gradle.py
          python3 tool/configure_android_manifest.py

      - name: Resolve dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze source
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Run automated tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test --no-pub --reporter expanded

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Verify APK was generated
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iraqi-curriculum-library-apk-v1.2.0
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 21
