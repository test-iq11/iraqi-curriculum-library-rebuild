```yaml
name: Build Iraqi Curriculum Library APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore updated project source
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="iraqi_curriculum_library_bottom_nav_persistence_fixed.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: Required updated project ZIP not found: $ARCHIVE"
            echo "Upload the updated ZIP to the repository root."
            find . -maxdepth 3 -type f -iname '*.zip' \
              -not -path './.git/*' -print
            exit 1
          fi

          echo "Restoring updated source from $ARCHIVE"

          SRC="$RUNNER_TEMP/iraqi_library_source"
          rm -rf "$SRC"
          mkdir -p "$SRC"

          unzip -tq "$ARCHIVE"
          unzip -oq "$ARCHIVE" -d "$SRC"

          test -f "$SRC/pubspec.yaml"
          test -f "$SRC/lib/main.dart"
          test -f "$SRC/tool/configure_android_gradle.py"
          test -f "$SRC/tool/configure_android_manifest.py"

          rsync -a --delete "$SRC/lib/" ./lib/
          rsync -a --delete "$SRC/tool/" ./tool/

          cp "$SRC/pubspec.yaml" ./pubspec.yaml

          if [ -f "$SRC/README_AR.md" ]; then
            cp "$SRC/README_AR.md" ./README_AR.md
          fi

          echo "Updated project source restored successfully."

      - name: Show Flutter version
        run: flutter --version

      - name: Recreate Android project from clean template
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          flutter create \
            --platforms=android \
            --project-name=iraqi_curriculum_library \
            --org=com.school.app .

      - name: Configure Android Gradle
        run: python3 tool/configure_android_gradle.py

      - name: Configure Android permissions
        run: python3 tool/configure_android_manifest.py

      - name: Clean project
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-pub
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iraqi-curriculum-library-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
```
