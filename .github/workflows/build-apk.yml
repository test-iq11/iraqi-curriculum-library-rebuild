name: Build Iraqi Curriculum Library

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Analyze and Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="iraqi_curriculum_library_storage_init_fixed.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Project ZIP not found: $ZIP_FILE"
            echo "ZIP files available in repository:"
            find . -maxdepth 3 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Found project ZIP: $ZIP_FILE"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted_project
          mkdir -p extracted_project
          unzip -q -o iraqi_curriculum_library_storage_init_fixed.zip \
            -d extracted_project

          PUBSPEC="$(find extracted_project -name pubspec.yaml \
            -type f -print -quit)"

          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml was not found inside the ZIP."
            find extracted_project -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/tool/configure_android_gradle.py"
          test -f "$PROJECT_DIR/tool/configure_android_manifest.py"

          echo "Flutter project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Recreate Android project from clean template
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          flutter create --platforms=android \
            --project-name=iraqi_curriculum_library \
            --org=com.school.app .

      - name: Configure Android Gradle (desugaring, SDK, disable R8 shrink)
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tool/configure_android_gradle.py

      - name: Configure Android permissions and notification receivers
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tool/configure_android_manifest.py

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze Flutter code
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub \
            --no-fatal-infos \
            --no-fatal-warnings
          ANALYZE_EXIT=$?
          set -e

          if [ "$ANALYZE_EXIT" -ne 0 ]; then
            echo "::warning::Flutter analyze reported errors. Continuing to build so compilation can be checked."
          fi

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iraqi-curriculum-library-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

