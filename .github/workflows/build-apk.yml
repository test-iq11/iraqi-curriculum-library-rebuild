
name: Build Iraqi Curriculum Library

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify updated project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="iraqi_curriculum_library_storage_init_fixed.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Required updated project ZIP not found: $ZIP"
            echo "ZIP files available in repository:"
            find . -maxdepth 2 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Found project ZIP: $ZIP"

      - name: Extract updated project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="iraqi_curriculum_library_storage_init_fixed.zip"
          mkdir -p extracted_project
          unzip -o "$ZIP" -d extracted_project

          echo "Extracted project files:"
          find extracted_project -maxdepth 3 \
            \( -name pubspec.yaml -o -name main.dart \) -print

          PUBSPEC="$(find extracted_project -name pubspec.yaml -print -quit)"

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml was not found in the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Check Android project configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            echo "Android folder not found. Creating Android platform files..."
            flutter create --platforms=android .
          fi

          if [ ! -f lib/main.dart ]; then
            echo "ERROR: lib/main.dart was not found."
            exit 1
          fi

      - name: Analyze Flutter project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze --no-pub

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release

      - name: Build Google Play App Bundle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build appbundle --release

      - name: Verify build outputs
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          if [ ! -f "$AAB" ]; then
            echo "ERROR: Release AAB was not generated."
            exit 1
          fi

          ls -lh "$APK" "$AAB"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iraqi-curriculum-library-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: iraqi-curriculum-library-aab
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
