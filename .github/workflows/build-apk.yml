name: Build Iraqi Library User + Manager APKs

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'iraqi_library_dual_v2.3.0.zip'
      - '.github/workflows/build-dual-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract the project ZIP on runner only
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/iraqi_library_dual_v2.3.0.zip"
          test -s "$ZIP" || { echo '::error::Upload iraqi_library_dual_v2.3.0.zip to repository root WITHOUT extracting'; exit 1; }
          mkdir -p "$RUNNER_TEMP/iraqi_library"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/iraqi_library"
          cd "$RUNNER_TEMP/iraqi_library"
          test -s pubspec.yaml
          test -s lib/main_user.dart
          test -s lib/main_admin.dart
          python3 ci/verify_library.py
          python3 ci/test_android_configuration.py
          echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and configure user/admin flavors
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          flutter --version
          flutter create --platforms=android --project-name=iraqi_school_library_dual --org=com.school.app .
          python3 tool/configure_android.py
          python3 ci/verify_android_flavors.py
          rm -f test/widget_test.dart

      - name: Resolve Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Validate and test
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos
          flutter test --reporter expanded

      - name: Build two separate installable APKs
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          LIBRARY_BRANCH: ${{ vars.LIBRARY_BRANCH || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          BRANCH="${LIBRARY_BRANCH:-main}"
          COMMON=(--dart-define="LIBRARY_OWNER=$OWNER" --dart-define="LIBRARY_REPO=$REPO" --dart-define="LIBRARY_BRANCH=$BRANCH")
          flutter build apk --release --flavor user -t lib/main_user.dart "${COMMON[@]}"
          flutter build apk --release --flavor admin -t lib/main_admin.dart "${COMMON[@]}"
          test -s build/app/outputs/flutter-apk/app-user-release.apk
          test -s build/app/outputs/flutter-apk/app-admin-release.apk
          mkdir -p "$RUNNER_TEMP/apk-output"
          cp build/app/outputs/flutter-apk/app-user-release.apk "$RUNNER_TEMP/apk-output/iraqi_library_users.apk"
          cp build/app/outputs/flutter-apk/app-admin-release.apk "$RUNNER_TEMP/apk-output/iraqi_library_manager.apk"
          echo 'Two APKs built successfully:'
          ls -lh "$RUNNER_TEMP/apk-output/"*.apk

      - name: Upload user APK
        uses: actions/upload-artifact@v4
        with:
          name: iraqi-library-users-apk
          path: ${{ runner.temp }}/apk-output/iraqi_library_users.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload manager APK
        uses: actions/upload-artifact@v4
        with:
          name: iraqi-library-manager-apk
          path: ${{ runner.temp }}/apk-output/iraqi_library_manager.apk
          if-no-files-found: error
          retention-days: 30
