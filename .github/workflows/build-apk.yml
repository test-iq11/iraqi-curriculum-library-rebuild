
name: Build Iraqi Curriculum Library

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Analyze and Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="iraqi_curriculum_library_storage_init_fixed.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Project ZIP not found: $ZIP_FILE"
            echo "ZIP files available in repository:"
            find . -maxdepth 3 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Found project ZIP: $ZIP_FILE"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted_project
          unzip -q -o iraqi_curriculum_library_storage_init_fixed.zip \
            -d extracted_project

          PUBSPEC="$(find extracted_project -name pubspec.yaml \
            -type f -print -quit)"

          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml was not found inside the ZIP."
            find extracted_project -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Flutter project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Prepare Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            echo "::error::Android Gradle configuration was not found."
            exit 1
          fi

      - name: Analyze Flutter code
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub \
            --no-fatal-infos \
            --no-fatal-warnings
          ANALYZE_EXIT=$?
          set -e

          if [ "$ANALYZE_EXIT" -ne 0 ]; then
            echo "::warning::Flutter analyze reported errors. Continuing to build so compilation can be checked."
          fi

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iraqi-curriculum-library-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Android App Bundle
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: iraqi-curriculum-library-aab
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
